<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Carte temps réel des transports TBM à Bordeaux Métropole : positions des véhicules et arrêts du réseau bus et tram."
    />
    <meta name="theme-color" content="#1565c0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://*.openstreetmap.org https://tiles.maps.eox.at; connect-src 'self' https://bdx.mecatran.com; font-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'"
    />
    <title>TBM — Carte temps réel | Bordeaux Métropole</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://bdx.mecatran.com" crossorigin />
    <link rel="preconnect" href="https://a.tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://tiles.maps.eox.at" crossorigin />
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=4" />
    <link rel="stylesheet" href="css/style.css?v=4" />
  </head>
  <body>
    <div id="map" role="application" aria-label="Carte interactive des transports TBM"></div>
    <aside id="toolbar" role="region" aria-label="Contrôles de la carte">
      <header class="panel panel-header">
        <p class="eyebrow">Bordeaux Métropole</p>
        <h1>TBM Live</h1>
        <p class="subtitle">Véhicules en direct &amp; arrêts du réseau</p>
      </header>

      <section class="panel" aria-labelledby="route-filter-title">
        <div class="panel-title-row">
          <h2 id="route-filter-title">Lignes</h2>
          <div class="panel-actions">
            <button type="button" id="highlight-clear" class="btn-text" hidden>Effacer surbrillance</button>
            <button type="button" id="route-reset" class="btn-text">Toutes les lignes</button>
          </div>
        </div>
        <input
          type="search"
          id="route-search"
          class="route-search"
          placeholder="Rechercher une ligne…"
          aria-label="Rechercher une ligne"
          autocomplete="off"
        />
        <div id="route-list" class="route-list" role="group" aria-label="Sélection des lignes"></div>
      </section>

      <section class="panel panel-controls" aria-label="Couches de la carte">
        <label for="vehicles-toggle" class="toggle-row">
          <input type="checkbox" id="vehicles-toggle" checked aria-describedby="status" />
          <span>Afficher les véhicules</span>
        </label>
        <label for="stops-toggle" class="toggle-row">
          <input type="checkbox" id="stops-toggle" checked aria-describedby="status" />
          <span>Afficher les arrêts <small>(zoom 14+)</small></span>
        </label>
      </section>

      <footer class="panel panel-status">
        <div id="status" class="loading" role="status" aria-live="polite">Chargement…</div>
      </footer>
    </aside>

    <script src="vendor/leaflet/leaflet.js?v=4" defer></script>
    <script src="js/i18n.js?v=4" defer></script>
    <script src="js/config.example.js?v=4" defer></script>
    <script src="js/app.js?v=4" defer></script>
  </body>
</html>
