<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Carte temps réel des transports TBM à Bordeaux Métropole : positions des véhicules et arrêts du réseau bus et tram."
    />
    <meta name="theme-color" content="#1565c0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://*.openstreetmap.org; connect-src 'self' https://bdx.mecatran.com; font-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'"
    />
    <title>TBM — Carte temps réel | Bordeaux Métropole</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://bdx.mecatran.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://a.tile.openstreetmap.org" crossorigin />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css?v=2" />
  </head>
  <body>
    <div id="map" role="application" aria-label="Carte interactive des transports TBM"></div>
    <aside id="toolbar" role="region" aria-label="Contrôles de la carte">
      <div class="panel">
        <h1>TBM — Bordeaux Métropole</h1>
        <label for="stops-toggle">
          <input type="checkbox" id="stops-toggle" checked aria-describedby="status" />
          Afficher les arrêts
        </label>
      </div>
      <div class="panel">
        <div id="status" class="loading" role="status" aria-live="polite">Chargement…</div>
      </div>
    </aside>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin="anonymous"
      defer
    ></script>
    <!-- Copiez js/config.example.js vers js/config.js pour personnaliser (optionnel). -->
    <script src="js/config.example.js?v=2" defer></script>
    <script src="js/app.js?v=2" defer></script>
  </body>
</html>
