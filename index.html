<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TBM — Carte temps réel</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="map" role="application" aria-label="Carte des transports TBM"></div>
    <div id="toolbar">
      <div class="panel">
        <h1>TBM — Bordeaux Métropole</h1>
        <label>
          <input type="checkbox" id="stops-toggle" checked />
          Afficher les arrêts
        </label>
      </div>
      <div class="panel">
        <div id="status" class="loading" aria-live="polite">Chargement…</div>
      </div>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- Copiez js/config.example.js vers js/config.js pour personnaliser (optionnel). -->
    <script src="js/config.example.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
